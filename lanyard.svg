<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 650" width="450" height="650">
  <defs>
    <!-- Card Hologram Sweep -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Avatar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff2a85"/>
    </filter>

    <clipPath id="avatarClip">
      <circle cx="225" cy="340" r="54"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Outfit:wght@400;700;800&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Damped pendulum drop &amp; perpetual gentle swing */
    .pendulum {
      transform-origin: 225px 0px;
      animation: swingPhysics 6s ease-in-out infinite;
    }

    @keyframes swingPhysics {
      0% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-10deg); }
      45% { transform: rotate(6deg); }
      60% { transform: rotate(-3deg); }
      75% { transform: rotate(1.5deg); }
      90% { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }

    .holo-sweep {
      animation: shine 4s infinite linear;
    }
    @keyframes shine {
      0% { transform: translateX(-300px) translateY(-200px); }
      100% { transform: translateX(400px) translateY(300px); }
    }
  </style>

  <g class="pendulum">
    <!-- Lanyard Pink Fabric Ribbon Strap -->
    <path d="M190,0 L210,130 L240,130 L260,0 Z" fill="#ff2a85"/>
    <path d="M210,130 L215,160 L235,160 L240,130 Z" fill="#d81b60"/>
    <text x="-80" y="222" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="3" transform="rotate(-84)">MOHIT KUMAR • DATA ANALYST</text>

    <!-- Metal Clasp &amp; Ring -->
    <rect x="212" y="160" width="26" height="22" rx="4" fill="#a1a1aa" stroke="#52525b" stroke-width="1.5"/>
    <circle cx="225" cy="190" r="14" fill="none" stroke="#d4d4d8" stroke-width="4"/>

    <!-- Glass ID Badge Container -->
    <g transform="translate(100, 205)">
      <!-- Card Body -->
      <rect width="250" height="390" rx="18" fill="#120624" fill-opacity="0.94" stroke="#ff2a85" stroke-width="2"/>
      
      <!-- Lanyard Clip Hole -->
      <rect x="105" y="12" width="40" height="8" rx="4" fill="#090314" stroke="#4a154b"/>

      <!-- Glowing Avatar Ring -->
      <circle cx="125" cy="135" r="58" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
      <circle cx="125" cy="135" r="54" fill="#2d1245"/>
      
      <!-- Cropped Avatar Image -->
      <image href="data:image/png;base64,PASTE_AVATAR_BASE64_HERE" x="71" y="81" width="108" height="108" clip-path="url(#avatarClip)"/>

      <!-- Name &amp; Title -->
      <text x="125" y="225" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Mohit Kumar</text>
      <text x="125" y="246" font-size="12" font-weight="600" fill="#ff2a85" text-anchor="middle" letter-spacing="1">DATA ANALYST</text>
      
      <rect x="50" y="260" width="150" height="24" rx="12" fill="#230d3d" stroke="#a855f7" stroke-width="1"/>
      <text x="125" y="276" class="mono" font-size="12" fill="#00f2fe" text-anchor="middle">@mohit189</text>

      <!-- Barcode Graphic -->
      <g transform="translate(35, 305)" fill="#ffffff" opacity="0.85">
        <rect x="0" y="0" width="4" height="35"/>
        <rect x="7" y="0" width="2" height="35"/>
        <rect x="12" y="0" width="6" height="35"/>
        <rect x="22" y="0" width="3" height="35"/>
        <rect x="29" y="0" width="7" height="35"/>
        <rect x="40" y="0" width="2" height="35"/>
        <rect x="46" y="0" width="5" height="35"/>
        <rect x="56" y="0" width="3" height="35"/>
        <rect x="63" y="0" width="8" height="35"/>
        <rect x="75" y="0" width="2" height="35"/>
        <rect x="81" y="0" width="4" height="35"/>
        <rect x="89" y="0" width="6" height="35"/>
        <rect x="100" y="0" width="3" height="35"/>
        <rect x="107" y="0" width="7" height="35"/>
        <rect x="118" y="0" width="4" height="35"/>
        <rect x="126" y="0" width="2" height="35"/>
        <rect x="132" y="0" width="5" height="35"/>
        <rect x="141" y="0" width="7" height="35"/>
        <rect x="152" y="0" width="3" height="35"/>
        <rect x="159" y="0" width="6" height="35"/>
        <rect x="170" y="0" width="4" height="35"/>
      </g>
      <text x="125" y="358" class="mono" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="4">81206-MK-2026</text>

      <!-- Holographic Shine Sweep -->
      <rect x="0" y="0" width="250" height="390" rx="18" fill="url(#holo)" class="holo-sweep"/>
    </g>
  </g>
</svg>
