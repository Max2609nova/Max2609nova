<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="50%" stop-color="#180b26"/>
      <stop offset="100%" stop-color="#2d0b38"/>
    </linearGradient>

    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85">
        <animate attributeName="stop-color" values="#ff2a85;#b537f2;#00f2fe;#ff2a85" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ff2a85;#b537f2;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scannerBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip Path for Rounded Banner -->
    <clipPath id="bannerClip">
      <rect width="1280" height="740" rx="24" ry="24"/>
    </clipPath>

    <!-- Character Hologram Entrance Clip -->
    <clipPath id="holoClip">
      <rect x="680" y="40" width="600" height="700">
        <animate attributeName="height" from="0" to="700" dur="2.2s" fill="freeze" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Outfit:wght@400;600;800&amp;display=swap');
    
    text { font-family: 'Outfit', -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Particles &amp; Sparkles */
    .particle {
      animation: rise 5s infinite linear;
      opacity: 0;
    }
    @keyframes rise {
      0% { transform: translateY(750px) scale(0.6); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-30px) scale(1.1); opacity: 0; }
    }

    /* Name Letter Pop */
    .char {
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Tech Stack Pills */
    .pill {
      opacity: 0;
      animation: fadeInPill 0.8s ease forwards;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .pill:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 0 10px #ff2a85);
      cursor: pointer;
    }
    @keyframes fadeInPill {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Neon Flickering Sign */
    .neon-text {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #ff2a85;
      animation: neonFlicker 3s infinite alternate;
    }
    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        filter: drop-shadow(0 0 5px #ff2a85) drop-shadow(0 0 15px #ff2a85);
        opacity: 1;
      }
      20%, 24%, 55% {
        filter: none;
        opacity: 0.35;
      }
    }

    /* Typing Roles */
    .role-item {
      font-size: 24px;
      font-weight: 600;
      fill: #00f2fe;
      opacity: 0;
      animation: cycleRole 12s infinite;
    }
    @keyframes cycleRole {
      0%, 20% { opacity: 1; transform: translateY(0); }
      25%, 95% { opacity: 0; transform: translateY(-10px); }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Banner Background -->
    <rect width="1280" height="740" fill="url(#bgGrad)"/>

    <!-- Ambient Glowing Orbs -->
    <circle cx="200" cy="180" r="180" fill="#ff2a85" opacity="0.12">
      <animate attributeName="r" values="160;210;160" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="500" r="220" fill="#a855f7" opacity="0.14">
      <animate attributeName="r" values="220;260;220" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Rising Particles -->
    <circle cx="150" cy="740" r="2.5" fill="#ff2a85" class="particle" style="animation-delay: 0.2s;"/>
    <circle cx="320" cy="740" r="3.5" fill="#a855f7" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="560" cy="740" r="2" fill="#00f2fe" class="particle" style="animation-delay: 2.8s;"/>
    <circle cx="820" cy="740" r="3" fill="#ff70a6" class="particle" style="animation-delay: 3.9s;"/>

    <!-- Terminal Line (User prompt) -->
    <g transform="translate(60, 50)">
      <rect width="520" height="42" rx="8" fill="#130924" stroke="#ff2a85" stroke-opacity="0.3"/>
      <circle cx="18" cy="21" r="5" fill="#ff5f56"/>
      <circle cx="34" cy="21" r="5" fill="#ffbd2e"/>
      <circle cx="50" cy="21" r="5" fill="#27c93f"/>
      <text x="75" y="26" class="mono" font-size="14" fill="#a855f7">mohit@analysis:~$</text>
      <!-- Terminal Typing Text -->
      <clipPath id="termClip">
        <rect x="235" y="0" width="0" height="40">
          <animate attributeName="width" values="0;200;200" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
        </rect>
      </clipPath>
      <text x="235" y="26" class="mono" font-size="14" fill="#00f2fe" clip-path="url(#termClip)">cat README.md</text>
      <rect x="350" y="14" width="8" height="15" fill="#ff2a85">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Outlined Script Name: MOHIT KUMAR -->
    <g transform="translate(60, 150)">
      <!-- Animated letters popping in -->
      <text font-size="64" font-weight="800" fill="url(#pinkPurple)">
        <tspan class="char" style="animation-delay: 0.1s;">M</tspan>
        <tspan class="char" style="animation-delay: 0.18s;">o</tspan>
        <tspan class="char" style="animation-delay: 0.26s;">h</tspan>
        <tspan class="char" style="animation-delay: 0.34s;">i</tspan>
        <tspan class="char" style="animation-delay: 0.42s;">t</tspan>
        <tspan dx="16" class="char" style="animation-delay: 0.50s;">K</tspan>
        <tspan class="char" style="animation-delay: 0.58s;">u</tspan>
        <tspan class="char" style="animation-delay: 0.66s;">m</tspan>
        <tspan class="char" style="animation-delay: 0.74s;">a</tspan>
        <tspan class="char" style="animation-delay: 0.82s;">r</tspan>
      </text>
    </g>

    <!-- Cycling Typed Roles -->
    <g transform="translate(60, 195)">
      <text class="role-item" style="animation-delay: 0s;">📊 Data Analyst &amp; BI Strategist</text>
      <text class="role-item" style="animation-delay: 4s;">🐍 Python &amp; SQL Artisan</text>
      <text class="role-item" style="animation-delay: 8s;">📈 Dashboard &amp; Visual Storyteller</text>
    </g>

    <!-- Quote Tagline Box -->
    <g transform="translate(60, 220)">
      <rect width="520" height="42" rx="10" fill="#1b0e30" stroke="#a855f7" stroke-dasharray="4,4"/>
      <text x="20" y="26" font-size="14" fill="#fbcfe8" font-style="italic">
        ✨ Turning raw data into actionable visual narratives.
      </text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 285)">
      <!-- Pill 1: Python -->
      <g class="pill" style="animation-delay: 0.4s;">
        <rect x="0" y="0" width="105" height="34" rx="17" fill="#2d1245" stroke="#ff2a85"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#fff">🐍 Python</text>
      </g>
      <!-- Pill 2: SQL -->
      <g class="pill" transform="translate(115, 0)" style="animation-delay: 0.55s;">
        <rect x="0" y="0" width="90" height="34" rx="17" fill="#2d1245" stroke="#a855f7"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#fff">🗄️ SQL</text>
      </g>
      <!-- Pill 3: Power BI -->
      <g class="pill" transform="translate(215, 0)" style="animation-delay: 0.7s;">
        <rect x="0" y="0" width="118" height="34" rx="17" fill="#2d1245" stroke="#00f2fe"/>
        <text x="20" y="22" font-size="13" font-weight="600" fill="#fff">⚡ Power BI</text>
      </g>
      <!-- Pill 4: Tableau -->
      <g class="pill" transform="translate(343, 0)" style="animation-delay: 0.85s;">
        <rect x="0" y="0" width="110" height="34" rx="17" fill="#2d1245" stroke="#ff70a6"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#fff">📊 Tableau</text>
      </g>
      <!-- Pill 5: Viz -->
      <g class="pill" transform="translate(463, 0)" style="animation-delay: 1.0s;">
        <rect x="0" y="0" width="100" height="34" rx="17" fill="#2d1245" stroke="#ffbd2e"/>
        <text x="18" y="22" font-size="13" font-weight="600" fill="#fff">🎨 Data Viz</text>
      </g>
    </g>

    <!-- Code Editor Window (buildDreams snippet typing) -->
    <g transform="translate(60, 345)">
      <rect width="540" height="230" rx="14" fill="#0f071c" stroke="#33174f" stroke-width="1.5"/>
      <rect width="540" height="32" rx="14" fill="#1b0c30"/>
      <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/>
      <circle cx="35" cy="16" r="4.5" fill="#ffbd2e"/>
      <circle cx="50" cy="16" r="4.5" fill="#27c93f"/>
      <text x="70" y="20" class="mono" font-size="11" fill="#a855f7">analysisPipeline.jsx</text>

      <!-- Code Text with Sequential Typing Lines -->
      <g transform="translate(24, 60)" class="mono" font-size="13" fill="#ec4899">
        <text y="0" fill="#a855f7">const <tspan fill="#00f2fe">buildInsights</tspan> = async (data) =&gt; {</text>
        <text y="26" fill="#f43f5e" dx="18">const clean = await data.cleanse().transform();</text>
        <text y="52" fill="#38bdf8" dx="18">const metrics = SQL.query(`SELECT value FROM clean`);</text>
        <text y="78" fill="#ec4899" dx="18">const viz = new Dashboard({ insights: metrics });</text>
        <text y="104" fill="#a855f7" dx="18">return viz.renderImpact();</text>
        <text y="130" fill="#a855f7">};</text>
        <text y="154" fill="#4ade80">// Status: Ready to uncover trends 🚀</text>
      </g>
    </g>

    <!-- Stats Bar at bottom left -->
    <g transform="translate(60, 600)">
      <rect width="540" height="48" rx="12" fill="#180a2b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="25" y="30" font-size="13" fill="#cbd5e1">Analytics Score:</text>
      <!-- Progress Bar Track -->
      <rect x="145" y="19" width="280" height="10" rx="5" fill="#2c1445"/>
      <!-- Animated Fill -->
      <rect x="145" y="19" width="260" height="10" rx="5" fill="url(#pinkPurple)">
        <animate attributeName="width" from="0" to="260" dur="2s" fill="freeze"/>
      </rect>
      <text x="445" y="30" class="mono" font-size="14" font-weight="700" fill="#00f2fe">99.8%</text>
    </g>

    <!-- Neon Sign: KEEP CODING KEEP GROWING -->
    <g transform="translate(60, 680)">
      <rect x="0" y="0" width="370" height="34" rx="8" fill="#130821" stroke="#ff2a85" stroke-width="1.5" opacity="0.8"/>
      <text x="24" y="23" class="neon-text">KEEP CODING • KEEP GROWING</text>
    </g>

    <!-- Character Image Box with Entrance Hologram Scan -->
    <g transform="translate(680, 50)" clip-path="url(#holoClip)">
      <!-- Rendered Character Base64 -->
      <image href="data:image/png;base64,PASTE_CHARACTER_BASE64_HERE" x="0" y="0" width="580" height="660" preserveAspectRatio="xMidYMid meet"/>
      <!-- Initial Scanline that sweeps once -->
      <line x1="0" y1="0" x2="580" y2="0" stroke="#00f2fe" stroke-width="4" filter="drop-shadow(0 0 8px #00f2fe)">
        <animate attributeName="y1" from="0" to="660" dur="2.2s" fill="freeze"/>
        <animate attributeName="y2" from="0" to="660" dur="2.2s" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0" dur="2.4s" fill="freeze"/>
      </line>
    </g>

    <!-- Continuous Ambient Horizontal Scan Beam (sweeps full banner every 3.5s) -->
    <rect x="0" y="0" width="1280" height="35" fill="url(#scannerBeam)" opacity="0.35">
      <animate attributeName="y" values="-40;740" dur="3.5s" repeatCount="indefinite" ease="linear"/>
    </rect>
  </g>
</svg>
    
