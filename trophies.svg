<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="920" height="130">
  <defs>
    <linearGradient id="tShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; text-anchor: middle; fill: #ffffff; }
    .cell { opacity: 0; animation: popTrophy 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popTrophy { to { opacity: 1; transform: scale(1); } }
  </style>

  <!-- Trophy 1 -->
  <g class="cell" style="animation-delay: 0.1s; transform-origin: 105px 65px; transform: scale(0.8);" transform="translate(10, 10)">
    <rect width="210" height="110" rx="12" fill="#140628" stroke="#ff2a85"/>
    <text x="105" y="38" font-size="28">🏆</text>
    <text x="105" y="68" font-size="14" font-weight="700" fill="#ff2a85">Data Master</text>
    <text x="105" y="90" font-size="11" fill="#cbd5e1">50+ Complex Datasets</text>
  </g>

  <!-- Trophy 2 -->
  <g class="cell" style="animation-delay: 0.25s; transform-origin: 345px 65px; transform: scale(0.8);" transform="translate(240, 10)">
    <rect width="210" height="110" rx="12" fill="#140628" stroke="#a855f7"/>
    <text x="105" y="38" font-size="28">⚡</text>
    <text x="105" y="68" font-size="14" font-weight="700" fill="#a855f7">Query Optimizer</text>
    <text x="105" y="90" font-size="11" fill="#cbd5e1">Sub-second SQL queries</text>
  </g>

  <!-- Trophy 3 -->
  <g class="cell" style="animation-delay: 0.4s; transform-origin: 585px 65px; transform: scale(0.8);" transform="translate(470, 10)">
    <rect width="210" height="110" rx="12" fill="#140628" stroke="#00f2fe"/>
    <text x="105" y="38" font-size="28">🎨</text>
    <text x="105" y="68" font-size="14" font-weight="700" fill="#00f2fe">Viz Architect</text>
    <text x="105" y="90" font-size="11" fill="#cbd5e1">Executive Dashboards</text>
  </g>

  <!-- Trophy 4 -->
  <g class="cell" style="animation-delay: 0.55s; transform-origin: 825px 65px; transform: scale(0.8);" transform="translate(700, 10)">
    <rect width="210" height="110" rx="12" fill="#140628" stroke="#f43f5e"/>
    <text x="105" y="38" font-size="28">🌟</text>
    <text x="105" y="68" font-size="14" font-weight="700" fill="#f43f5e">Star Contributor</text>
    <text x="105" y="90" font-size="11" fill="#cbd5e1">Consistent Commits</text>
  </g>
</svg>
