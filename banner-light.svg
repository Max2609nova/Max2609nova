<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f9"/>
      <stop offset="50%" stop-color="#f8eefb"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>

    <linearGradient id="pinkPurpleLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <clipPath id="bannerClipLight">
      <rect width="1280" height="740" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Outfit:wght@400;600;800&amp;display=swap');
    text { font-family: 'Outfit', -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <g clip-path="url(#bannerClipLight)">
    <rect width="1280" height="740" fill="url(#bgLight)" stroke="#fbcfe8" stroke-width="2"/>
    
    <!-- Top Terminal Line -->
    <g transform="translate(60, 50)">
      <rect width="520" height="42" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
      <circle cx="18" cy="21" r="5" fill="#f87171"/>
      <circle cx="34" cy="21" r="5" fill="#fbbf24"/>
      <circle cx="50" cy="21" r="5" fill="#34d399"/>
      <text x="75" y="26" class="mono" font-size="14" fill="#9333ea">mohit@analysis:~$</text>
      <text x="235" y="26" class="mono" font-size="14" fill="#0284c7">cat README.md</text>
    </g>

    <!-- Name -->
    <g transform="translate(60, 150)">
      <text font-size="64" font-weight="800" fill="url(#pinkPurpleLight)">Mohit Kumar</text>
    </g>

    <g transform="translate(60, 195)">
      <text font-size="24" font-weight="600" fill="#0284c7">📊 Data Analyst &amp; BI Strategist</text>
    </g>

    <!-- Tagline Box -->
    <g transform="translate(60, 225)">
      <rect width="520" height="42" rx="10" fill="#ffffff" stroke="#c084fc"/>
      <text x="20" y="26" font-size="14" fill="#475569" font-style="italic">
        ✨ Turning raw data into actionable visual narratives.
      </text>
    </g>

    <!-- Pills -->
    <g transform="translate(60, 285)">
      <g>
        <rect x="0" y="0" width="105" height="34" rx="17" fill="#fdf2f8" stroke="#db2777"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#9d174d">🐍 Python</text>
      </g>
      <g transform="translate(115, 0)">
        <rect x="0" y="0" width="90" height="34" rx="17" fill="#faf5ff" stroke="#7c3aed"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#5b21b6">🗄️ SQL</text>
      </g>
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="118" height="34" rx="17" fill="#f0fdfa" stroke="#0284c7"/>
        <text x="20" y="22" font-size="13" font-weight="600" fill="#0369a1">⚡ Power BI</text>
      </g>
      <g transform="translate(343, 0)">
        <rect x="0" y="0" width="110" height="34" rx="17" fill="#fff1f2" stroke="#f43f5e"/>
        <text x="22" y="22" font-size="13" font-weight="600" fill="#be123c">📊 Tableau</text>
      </g>
      <g transform="translate(463, 0)">
        <rect x="0" y="0" width="100" height="34" rx="17" fill="#fffbeb" stroke="#d97706"/>
        <text x="18" y="22" font-size="13" font-weight="600" fill="#92400e">🎨 Data Viz</text>
      </g>
    </g>

    <!-- Code Block -->
    <g transform="translate(60, 345)">
      <rect width="540" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect width="540" height="32" rx="14" fill="#f1f5f9"/>
      <text x="20" y="20" class="mono" font-size="11" fill="#64748b">analysisPipeline.jsx</text>
      <g transform="translate(24, 60)" class="mono" font-size="13" fill="#be185d">
        <text y="0" fill="#7c3aed">const <tspan fill="#0284c7">buildInsights</tspan> = async (data) =&gt; {</text>
        <text y="26" fill="#be123c" dx="18">const clean = await data.cleanse().transform();</text>
        <text y="52" fill="#0284c7" dx="18">const metrics = SQL.query(`SELECT value FROM clean`);</text>
        <text y="78" fill="#9333ea" dx="18">const viz = new Dashboard({ insights: metrics });</text>
        <text y="104" fill="#7c3aed" dx="18">return viz.renderImpact();</text>
        <text y="130" fill="#7c3aed">};</text>
      </g>
    </g>

    <!-- Character Image -->
    <g transform="translate(680, 50)">
      <image href="data:image/png;base64,PASTE_CHARACTER_BASE64_HERE" x="0" y="0" width="580" height="660" preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>
</svg>
